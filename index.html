<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm danh Hội nghị - Đảng ủy xã Xuân Phước</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #8e0000 0%, #c8102e 50%, #8e0000 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            position: relative;
        }

        /* Hình nền chìm toàn màn hình */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            /* background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Flag_of_the_Communist_Party_of_Vietnam.svg/512px-Flag_of_the_Communist_Party_of_Vietnam.svg.png'); */
            /* background-image: url('https://github.com/khiemht-du-xp/attendance-conferences/blob/main/statics/phuxuan-lake.png'); */
            background-image: url('https://raw.githubusercontent.com/khiemht-du-xp/attendance-conferences/refs/heads/main/statics/phuxuan-lake.png');
            background-size: 100%;
            background-position: center center;
            background-repeat: no-repeat;
            opacity: 1.0;
            z-index: 0;
            pointer-events: none;
        }

        .container { position: relative; z-index: 2; }

        .card { 
            border: 2px solid #ffc107;
            border-radius: 14px; 
            box-shadow: 0 12px 35px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.98);
        }

        .card-body { padding: 2rem 1.75rem; }

        .header-title {
            color: #b71c1c;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 1.3rem;
        }
        
        .conference-name {
            color: #d32f2f;
            font-weight: 700;
            font-size: 1.05rem;
            line-height: 1.4;
        }

        /* Khung WiFi */
        .wifi-box {
            background-color: #fff8e1;
            border: 1px dashed #ffb300;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: #333;
        }
        .wifi-box strong { color: #c62828; }

        /* Thanh trạng thái GPS */
        .gps-status {
            font-size: 0.85rem;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-weight: 600;
        }

        /* Nút chọn Vào / Ra */
        .btn-check:checked + .btn-outline-danger {
            background-color: #c8102e;
            border-color: #c8102e;
            color: #ffd54f;
            font-weight: 700;
        }

        /* Nút Xác nhận vàng kim chữ đỏ */
        .btn-submit {
            background: linear-gradient(180deg, #ffd54f 0%, #ffb300 100%);
            border: 1px solid #ffa000;
            color: #9b0000;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
        }
        .btn-submit:hover:not(:disabled) {
            background: linear-gradient(180deg, #ffca28 0%, #ffa000 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 179, 0, 0.5);
        }

        .form-label { font-weight: 600; color: #444; font-size: 0.9rem; }
        .device-badge { font-size: 0.75rem; color: #777; margin-top: 15px; }

        /* Hiệu ứng cờ rơi */
        #flag-fall-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .falling-flag {
            position: absolute;
            top: -50px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.25);
            border-radius: 2px;
        }
        @keyframes fallAnimation {
            0% { top: -10%; transform: translateX(0) rotate(0deg); opacity: 0; }
            15% { opacity: 0.9; }
            50% { transform: translateX(25px) rotate(8deg); }
            100% { top: 110%; transform: translateX(-25px) rotate(-12deg); opacity: 0; }
        }
    </style>
</head>

    <script>
        // =========================================================================
        // DÁN ĐƯỜNG DẪN WEB APP GOOGLE APPS SCRIPT CỦA BẠN VÀO DÒNG DƯỚI ĐÂY:
        // const GAS_URL = "https://script.google.com/macros/s/AKfycbyDK7CZJjYPYn8aE1-A66hddRtgoR6z_d8dzeQ53h6WkuBzd3PZAkV49ZT5Kh5aCDJcPg/exec";
        // const GAS_URL = "https://script.google.com/macros/s/AKfycbxGkpxtkdN7w7IaI0Jd0KrdOboQxOjzq3gLCq7exkMzIXYMhWjM6LlkNBjyuOhvdBH6xw/exec";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx-inyPhNev6IwoV45bHM9h4S-4Crwc344SveALAKdVV1yrLxPSc09coT9TifGcneTDvQ/exec";
        // =========================================================================

        let venueConfig = null;
        let userCoords = { lat: null, lon: null, distance: null };
        let currentDeviceId = "";

        // 1. Tạo mã định danh thiết bị chống điểm danh 2 lần (Hardware + Canvas Fingerprint)
        function generateDeviceFingerprint() {
            // let canvasData = "no-canvas";
            // 1. Ưu tiên đọc lại mã đã lưu (dùng key v2 để tự động bỏ qua mã cũ bị lệch trước đó)
            try {
                const storedId = localStorage.getItem("duxp_device_id_v2");
                if (storedId && storedId.startsWith("DEV-")) {
                    return storedId;
                }
                const cookieMatch = document.cookie.match(/(?:^|;\s*)duxp_device_id_v2=(DEV-[A-F0-9]+)/);
                if (cookieMatch) {
                    localStorage.setItem("duxp_device_id_v2", cookieMatch[1]);
                    return cookieMatch[1];
                }
            } catch (e) {
            // Trình duyệt chặn đọc storage -> bỏ qua để tự băm lại từ phần cứng bên dưới
            }
            
            // Lấy thông tin chip đồ họa (GPU) - Cố định trên mọi trình duyệt của cùng 1 điện thoại
            let gpuRenderer = "no-gpu";
            // try {
            //     const canvas = document.createElement('canvas');
            //     const ctx = canvas.getContext('2d');
            //     if (ctx) {
            //         ctx.textBaseline = "top";
            //         ctx.font = "14px 'Arial'";
            //         ctx.fillStyle = "#f60";
            //         ctx.fillRect(125, 1, 62, 20);
            //         ctx.fillStyle = "#069";
            //         ctx.fillText("DANG_UY_XUAN_PHUOC", 2, 15);
            //         const canvasData = canvas.toDataURL();
            //     }
            // } catch (e) {
            //     canvasData = "canvas-blocked";
            // }

            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || "webgl-ok";
                    }
                }
            } catch (e) {
                gpuRenderer = "gpu-blocked";
            }

            // Sắp xếp chiều rộng/cao màn hình cố định (tránh thay đổi khi xoay ngang/dọc điện thoại)
            const w = Math.min(screen.width || 0, screen.height || 0);
            const h = Math.max(screen.width || 0, screen.height || 0);
            const dpr = window.devicePixelRatio || 1;
            

            // const rawTraits = [
            //     navigator.userAgent || "ua",
            //     (screen.width || 0) + "x" + (screen.height || 0), //+ "x" + screen.colorDepth,
            //     (Intl.DateTimeFormat().resolvedOptions().timeZone || "tz"),
            //     navigator.hardwareConcurrency || "cpu",
            //     canvasData
            // ].join("###");

            // Chỉ ghép các thông số phần cứng bất biến (Bỏ UserAgent và 2D Canvas)
            const hardwareTraits = [
                `${w}x${h}@${dpr}`,
                navigator.platform || "platform",
                navigator.hardwareConcurrency || "cores",
                navigator.deviceMemory || "mem",
                (Intl.DateTimeFormat().resolvedOptions().timeZone) || "tz",
                gpuRenderer
            ].join("|");

            // Băm chuỗi thành mã 8 ký tự Hex
            let hash = 0;
            for (let i = 0; i < hardwareTraits.length; i++) {
                const char = hardwareTraits.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0;
            }
            // const hexHash = Math.abs(hash).toString(16).toUpperCase().padStart(8, '0');
            // const fallbackId = "DEV-" + Math.abs(hash).toString(16).toUpperCase().padStart(8, '0');
            const hardwareId = "DEV-" + Math.abs(hash).toString(16).toUpperCase().padStart(8, '0');
            // Kết hợp lưu trữ localStorage để tăng độ bền vững
            // try {
            //     let savedId = localStorage.getItem("duxp_device_id");
            //     if (!savedId) {
            //         savedId = fallbackId; //"DEV-" + hexHash;
            //         localStorage.setItem("duxp_device_id", savedId);
            //     }
            //     return savedId;
            // } catch (e) {
            //     return fallbackId;
            // }

            // Lưu đồng thời vào localStorage và Cookie để giữ nguyên mã trong cùng trình duyệt
            try {
                localStorage.setItem("duxp_device_id_v2", hardwareId);
                document.cookie = `duxp_device_id_v2=${hardwareId}; max-age=31536000; path=/; SameSite=Lax`;
            } catch (e) {
                try {
                    sessionStorage.setItem("duxp_device_id_v2", hardwareId);
                } catch (err) {
                // Mọi bộ nhớ trình duyệt đều bị khóa -> vẫn trả về hardwareId đã băm ở bước 2
                }
            }

            return hardwareId;
        }

        // Tính khoảng cách Haversine (mét)
        function calcDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        // 2. Lấy tọa độ GPS người dùng
        function requestUserLocation() {
            const gpsBox = document.getElementById('gpsStatus');
            const submitBtn = document.getElementById('submitBtn');

            if (!navigator.geolocation) {
                gpsBox.className = "gps-status alert alert-danger";
                gpsBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation me-1"></i> Trình duyệt không hỗ trợ định vị GPS!';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userCoords.lat = pos.coords.latitude;
                    userCoords.lon = pos.coords.longitude;
                    const dist = calcDistance(userCoords.lat, userCoords.lon, venueConfig.ViDo, venueConfig.KinhDo);
                    userCoords.distance = dist;

                    if (dist <= venueConfig.BanKinh) {
                        gpsBox.className = "gps-status alert alert-success";
                        gpsBox.innerHTML = `<i class="fa-solid fa-circle-check me-1"></i> Vị trí hợp lệ: Cách hội trường <strong>${dist}m</strong> (Cho phép ≤ ${venueConfig.BanKinh}m)`;
                        submitBtn.disabled = false;
                    } else {
                        gpsBox.className = "gps-status alert alert-danger";
                        gpsBox.innerHTML = `<i class="fa-solid fa-location-dot me-1"></i> Ngoài phạm vi: Cách hội trường <strong>${dist}m</strong> (Yêu cầu ≤ ${venueConfig.BanKinh}m). <br><button type="button" class="btn btn-sm btn-outline-danger mt-1" onclick="requestUserLocation()">Cập nhật lại vị trí</button>`;
                        submitBtn.disabled = true;
                    }
                },
                (err) => {
                    gpsBox.className = "gps-status alert alert-warning";
                    gpsBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation me-1"></i> Chưa cấp quyền GPS. Vui lòng bật <strong>Vị trí (Location)</strong> trên điện thoại rồi bấm tải lại trang!`;
                    submitBtn.disabled = true;
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        // 3. Tải cấu hình cuộc họp từ Google Apps Script
        async function initApp() {
            currentDeviceId = generateDeviceFingerprint();
            document.getElementById('deviceIdDisplay').textContent = currentDeviceId;

            try {
                const res = await fetch(`${GAS_URL}?action=getConfig`);
                const json = await res.json();

                if (json.status === "success") {
                    venueConfig = json.data;
                    document.getElementById('meetingTitle').textContent = venueConfig.TenCuocHop;

                    if (venueConfig.TrangThai === "OPEN") {
                        document.getElementById('activeFormArea').classList.remove('d-none');
                        requestUserLocation();
                    } else {
                        document.getElementById('closedBanner').classList.remove('d-none');
                    }
                }
            } catch (e) {
                document.getElementById('meetingTitle').textContent = "Lỗi kết nối máy chủ Google Apps Script!";
            }
        }

        // 4. Xử lý gửi điểm danh
        document.getElementById('checkinForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const btnContent = document.getElementById('btnContent');
            const resultAlert = document.getElementById('resultAlert');
            const checkType = document.querySelector('input[name="checkType"]:checked').value;
            
            submitBtn.disabled = true;
            btnContent.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang gửi dữ liệu điểm danh...';
            resultAlert.classList.add('d-none');

            const payload = {
                action: "checkin",
                type: document.querySelector('input[name="checkType"]:checked').value,
                title: document.getElementById('title').value,
                name: document.getElementById('name').value.trim(),
                deviceId: currentDeviceId,
                lat: userCoords.lat,
                lon: userCoords.lon
            };

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify(payload) // Dùng text/plain mặc định để tránh lỗi CORS preflight
                });
                const resJson = await response.json();

                resultAlert.classList.remove('d-none');
                if (resJson.status === "success") {
                    const driveUrl = (resJson.redirectUrl || (venueConfig && venueConfig.LinkTaiLieu) || "").trim();
                    resultAlert.className = "alert alert-success text-start";
                    document.getElementById('name').value = "";

                    if (driveUrl && driveUrl.startsWith("http")) {
                        if (checkType === "VÀO") {
                            let secondsLeft = 3;
                            resultAlert.innerHTML = `
                                <i class="fa-solid fa-circle-check me-2"></i><strong>THÀNH CÔNG!</strong><br>${resJson.message}
                                <hr class="my-2">
                                <div class="text-center">
                                    <p class="mb-2 fw-bold text-primary">
                                        <span class="spinner-border spinner-border-sm me-1"></span>
                                        Đang chuyển sang thư mục tài liệu sau <span id="redirectTimer">${secondsLeft}</span>s...
                                    </p>
                                    <a href="${driveUrl}" class="btn btn-success btn-sm w-100 fw-bold">
                                        <i class="fa-brands fa-google-drive me-1"></i> Mở thư mục tài liệu ngay
                                    </a>
                                </div>
                            `;

                            const timerInterval = setInterval(() => {
                                secondsLeft--;
                                const timerEl = document.getElementById('redirectTimer');
                                if (timerEl) timerEl.textContent = secondsLeft;
                                if (secondsLeft <= 0) {
                                    clearInterval(timerInterval);
                                    window.location.href = driveUrl;
                                }
                            }, 1000);
                        } else {
                            // Nếu điểm danh RA, hiển thị nút xem lại tài liệu nếu cần
                            resultAlert.innerHTML = `
                                <i class="fa-solid fa-circle-check me-2"></i><strong>THÀNH CÔNG!</strong><br>${resJson.message}
                                <div class="mt-2">
                                    <a href="${driveUrl}" class="btn btn-outline-success btn-sm w-100 fw-bold">
                                        <i class="fa-brands fa-google-drive me-1"></i> Xem lại tài liệu hội nghị
                                    </a>
                                </div>
                            `;
                        }    
                    
                    // resultAlert.innerHTML = `<i class="fa-solid fa-circle-check me-2"></i><strong>THÀNH CÔNG!</strong><br>${resJson.message}`;
                    
                } else {
                    resultAlert.className = "alert alert-danger text-start";
                    resultAlert.innerHTML = `<i class="fa-solid fa-circle-xmark me-2"></i><strong>KHÔNG THỂ ĐIỂM DANH!</strong><br>${resJson.message}`; 
                } 
            }
            }
            catch (err) { 
                resultAlert.classList.remove('d-none'); 
                resultAlert.className = "alert alert-danger"; 
                resultAlert.textContent = "Lỗi kết nối mạng. Vui lòng thử lại!"; 
            } 
            finally { 
                submitBtn.disabled = false; 
                btnContent.innerHTML = '<i class="fa-solid fa-check-circle me-2"></i>Xác nhận điểm danh'; 
            } });  
            // 5. Hiệu ứng cờ Đảng & cờ Tổ quốc rơi 
            // const flagImages = [ 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Flag_of_the_Communist_Party_of_Vietnam.svg/200px-Flag_of_the_Communist_Party_of_Vietnam.svg.png', 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Flag_of_Vietnam.svg/200px-Flag_of_Vietnam.svg.png' ]; 
            // const flagImages = ['https://upload.wikimedia.org/wikipedia/commons/b/bf/L%C3%A1_c%E1%BB%9D_c%E1%BB%A7a_%C4%90%E1%BA%A3ng_c%E1%BB%99ng_s%E1%BA%A3n_Vi%E1%BB%87t_Nam.png'];
            const flagImages = ['https://raw.githubusercontent.com/khiemht-du-xp/attendance-conferences/refs/heads/main/statics/flag-party-VN-rm.png'];
            
            function createFallingFlag() { 
                const container = document.getElementById('flag-fall-container'); 
                if (!container) return; 
                const flag = document.createElement('img'); 
                flag.src = flagImages[Math.floor(Math.random() * flagImages.length)]; 
                flag.classList.add('falling-flag'); const size = Math.random() * 14 + 22; 
                const duration = Math.random() * 5 + 8; flag.style.width = `${size}px`;
                flag.style.left = `${Math.random() * 100}vw`; 
                flag.style.animation = `fallAnimation ${duration}s linear infinite`;
                container.appendChild(flag);
                setTimeout(() => flag.remove(), duration * 1000);
            }
            for (let i = 0; i < 10; i++) setTimeout(createFallingFlag, i * 900);
            setInterval(createFallingFlag, 2800);

            window.onload = initApp;
    </script>
